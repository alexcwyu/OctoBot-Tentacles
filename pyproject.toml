[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "octobot-tentacles"
version = "0.1.0"
description = "OctoBot Tentacles - plugin collection for OctoBot trading bot"
readme = "README.md"
license = "LGPL-3.0-only"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff>=0.11",
  "pyright>=1.1",
  "pytest>=9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/octobot_tentacles"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PERF", "TC", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["octobot_tentacles"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "-q", "--strict-markers", "--import-mode=importlib"]
testpaths = ["tests"]
pythonpath = ["src"]
xfail_strict = true
filterwarnings = ["error"]
